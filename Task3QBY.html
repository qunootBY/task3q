<!DOCTYPE html>
<html>
<head>
    <title>Images In Tables</title>
</head>
<body>

    <h1>This is Task (3)</h1>
    <h2>Images In Tables</h2>
    <hr>
    <h3>What are your favourite pets?</h3>

    <table border="1">
        <tr>
            <th>Pet Image</th>
            <th>More Facts about (as a link)</th>
        </tr>

        <tr>
            <td><img src="horse.jpg" alt="Horse" width="200" height="200"></td>
            <td align="center"><a href="https://en.wikipedia.org/wiki/Horse">Horse</a></td>
        </tr>

        <tr>
            <td><img src="dog.jpg" alt="Dog" width="200" height="200"></td>
            <td align="center"><a href="https://en.wikipedia.org/wiki/Dog">Dogs</a></td>
        </tr>

        <tr>
            <td><img src="cat.jpg" alt="Cat" width="200" height="200"></td>
            <td align="center"><a href="https://en.wikipedia.org/wiki/Cat">Cats</a></td>
        </tr>
    </table>

</body>
</html>
