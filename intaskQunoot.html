<!DOCTYPE html>
<html>
<body>
<h2>Text input fields</h2>

<form>
  <label for="fname">First name:</label><br>
  <input type="text" id="fname" name="fname"><br>
  <label for="lname">Last name:</label><br>
  <input type="text" id="lname" name="lname" >
</form>
<br>
<hr>
<h2>Radio Buttons</h2>

<p>Choose your favorite Web language:</p>

<form>
  <input type="radio" id="html" name="fav_language" value="HTML">
  <label for="html">HTML</label><br>
  <input type="radio" id="css" name="fav_language" value="CSS">
  <label for="css">CSS</label><br>
  <input type="radio" id="javascript" name="fav_language" value="JavaScript">
  <label for="javascript">JavaScript</label>
</form> 
<br>
<hr>
<img src="cat.jpg" alt="قطة" width="300">
<br>
<hr>
<audio controls>
  <source src="song.mp3" type="audio/mpeg">
</audio>
<br>
<hr>
<video controls width="400">
  <source src="clip.mp4" type="video/mp4">
</video>
<br>
<hr>
<iframe src="https://www.wikipedia.org" width="300" height="400" title="W3Schools Example"> 
</iframe>
<br>
<hr>
<p>Common Usage Examples of iFrame </p>

<p> Set Height and Width</p>
<iframe src=https://www.wikipedia.org height="200" width="300" title="Iframe Example"></iframe>
<br>
<hr>
<p>Remove Border </p>
<iframe src="demo_iframe.htm" style="border:none;" title="No Border"></iframe>
<br>
<hr>
<p>Target an Iframe with a Link </p>
<iframe src="demo_iframe.htm" name="iframe_a" title="Iframe Example"></iframe>
<p><a href="https://www.wikipedia.org" target="iframe_a">Open in iframe</a></p>


</body>
</html>
